name: Create SBLT Build (MinGW)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install mingw-w64 and Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 ninja-build

    - name: Build with CMake and Ninja
      run: |
        cmake -S . -B build-linux -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
        cmake --build build-linux

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Build Artifacts (MinGW)
        path: |
          build-linux/IPHLPAPI.dll
          build-linux/WSOCK32.dll
          build-linux/SBLT_DLL_UPDATER.exe
